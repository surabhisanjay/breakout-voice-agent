<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vapi Voice Agent Tester</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="glass-panel">
            <h1>Vapi Agent Tester</h1>
            <div class="status-indicator" id="statusIndicator">
                <span class="dot"></span>
                <span class="text">Disconnected</span>
            </div>
        </header>

        <div class="main-content">
            <!-- Settings Panel -->
            <aside class="settings-panel glass-panel">
                <h2>Configuration</h2>
                <div class="form-group">
                    <label for="publicKey">Vapi Public Key</label>
                    <input type="password" id="publicKey" placeholder="pk_..." />
                </div>
                <div class="form-group">
                    <label for="assistantId">Assistant ID</label>
                    <input type="text" id="assistantId" placeholder="xxxxxxxx-xxxx-xxxx..." />
                </div>
                <button id="saveConfigBtn" class="btn primary">Save Config</button>
                <div id="configSuccess" class="success-message hidden">Configuration saved!</div>
            </aside>

            <!-- Call Control Panel -->
            <section class="call-panel glass-panel">
                <div class="mic-container">
                    <div class="ripple" id="ripple1"></div>
                    <div class="ripple" id="ripple2"></div>
                    <button id="micBtn" class="mic-button" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="mic-icon">
                            <path d="M12 14a3 3 0 003-3V6a3 3 0 00-6 0v5a3 3 0 003 3zm5-3a5.002 5.002 0 01-4 4.9V19h3v2H8v-2h3v-3.1A5.002 5.002 0 017 11H5a7 7 0 0014 0h-2z"/>
                        </svg>
                    </button>
                </div>
                <h3 id="callStateText">Ready to connect</h3>
            </section>

            <!-- Transcript Panel -->
            <section class="transcript-panel glass-panel">
                <h2>Transcript</h2>
                <div id="transcriptBox" class="transcript-box">
                    <div class="transcript-placeholder" id="transcriptPlaceholder">Conversation will appear here...</div>
                </div>
            </section>
        </div>
    </div>

    <!-- Ensure type="module" to allow ES modules -->
    <script type="module" src="app.js"></script>
</body>
</html>
